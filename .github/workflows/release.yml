name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, notarise, publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Test
        run: swift test

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Build
        run: ./Scripts/bundle.sh release

      - name: Sign
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
        run: ./Scripts/sign.sh

      - name: Store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials ration-notary \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" \
            --password "$APP_SPECIFIC_PASSWORD"

      - name: Notarise
        run: ./Scripts/notarize.sh

      - name: Sign the update and publish the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="$(cat VERSION)"
          DMG=".build/Ration-${VERSION}.dmg"
          SIGN="$(find .build/artifacts -name sign_update -type f | head -1)"
          [ -x "$SIGN" ] || { echo "::error::sign_update not found"; exit 1; }

          # The private key never lands on disk unencrypted for longer than
          # this step; the signature is what users' copies actually verify.
          # sign_update prints `sparkle:edSignature="..." length="..."`; take
          # just the signature.
          SIGNATURE="$(echo "$SPARKLE_PRIVATE_KEY" \
            | "$SIGN" "$DMG" --ed-key-file - \
            | sed -n 's/.*edSignature="\([^"]*\)".*/\1/p')"
          [ -n "$SIGNATURE" ] || { echo "::error::signing produced no signature"; exit 1; }

          LENGTH="$(stat -f%z "$DMG")"
          URL="https://github.com/mcpeixoto/ration/releases/download/${GITHUB_REF_NAME}/Ration-${VERSION}.dmg"
          PUBDATE="$(date -R)"

          # Prepend this release to the feed, keeping older entries so people
          # on much older builds still find a path forward.
          python3 Scripts/update_appcast.py \
            --version "$VERSION" \
            --build "$(git rev-list --count HEAD)" \
            --url "$URL" \
            --length "$LENGTH" \
            --signature "$SIGNATURE" \
            --pubdate "$PUBDATE"

      # A tag build checks out a detached HEAD, so land the feed on main
      # explicitly — that is the URL every installed copy polls.
      - name: Commit the appcast to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp appcast.xml /tmp/appcast.xml
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/appcast.xml appcast.xml
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "appcast unchanged"
          else
            git commit -m "chore: appcast for ${GITHUB_REF_NAME}"
            git push origin main
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION)"
          DMG=".build/Ration-${VERSION}.dmg"
          SHA="$(shasum -a 256 "$DMG" | cut -d' ' -f1)"

          gh release create "${GITHUB_REF_NAME}" "$DMG" \
            --title "Ration ${VERSION}" \
            --generate-notes \
            --notes-start-tag "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')" || \
          gh release create "${GITHUB_REF_NAME}" "$DMG" \
            --title "Ration ${VERSION}" --generate-notes

          echo "### Cask update" >> "$GITHUB_STEP_SUMMARY"
          echo '```ruby' >> "$GITHUB_STEP_SUMMARY"
          echo "version \"${VERSION}\"" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256 \"${SHA}\"" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
