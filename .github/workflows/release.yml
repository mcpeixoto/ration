name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Defaults to the current ref."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release-macos:
    name: Build, notarise, publish (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # A dispatch checks out a branch; check out the tag being released so
          # the built binary matches what the tag points at.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # One place decides the tag, so a manual re-run produces the same URLs a
      # tag push would.
      - name: Resolve the release tag
        run: echo "RELEASE_TAG=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Select the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Allow the workflow to push the appcast
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Test
        run: swift test

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Build
        run: ./Scripts/bundle.sh release

      - name: Sign
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
        run: ./Scripts/sign.sh

      - name: Store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials ration-notary \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" \
            --password "$APP_SPECIFIC_PASSWORD"

      - name: Notarise
        run: ./Scripts/notarize.sh

      - name: Sign the update and publish the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="$(cat VERSION)"
          DMG=".build/Ration-${VERSION}.dmg"
          SIGN="$(find .build/artifacts -name sign_update -type f | head -1)"
          [ -x "$SIGN" ] || { echo "::error::sign_update not found"; exit 1; }

          # The private key never lands on disk unencrypted for longer than
          # this step; the signature is what users' copies actually verify.
          # sign_update prints `sparkle:edSignature="..." length="..."`; take
          # just the signature.
          SIGNATURE="$(echo "$SPARKLE_PRIVATE_KEY" \
            | "$SIGN" "$DMG" --ed-key-file - \
            | sed -n 's/.*edSignature="\([^"]*\)".*/\1/p')"
          [ -n "$SIGNATURE" ] || { echo "::error::signing produced no signature"; exit 1; }

          LENGTH="$(stat -f%z "$DMG")"
          URL="https://github.com/mcpeixoto/ration/releases/download/${RELEASE_TAG}/Ration-${VERSION}.dmg"
          PUBDATE="$(date -R)"

          # Prepend this release to the feed, keeping older entries so people
          # on much older builds still find a path forward.
          python3 Scripts/update_appcast.py \
            --version "$VERSION" \
            --build "$(git rev-list --count HEAD)" \
            --url "$URL" \
            --length "$LENGTH" \
            --signature "$SIGNATURE" \
            --pubdate "$PUBDATE"

      # A tag build checks out a detached HEAD, so land the feed on main
      # explicitly — that is the URL every installed copy polls.
      - name: Commit the appcast to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp appcast.xml /tmp/appcast.xml
          # Discard the working-tree edit before switching branches: git
          # refuses to check out over a modified file, and we already hold the
          # only copy that matters in /tmp.
          git checkout -- appcast.xml 2>/dev/null || true
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/appcast.xml appcast.xml
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "appcast unchanged"
          else
            git commit -m "chore: appcast for ${RELEASE_TAG}"
            git push origin main
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION)"
          DMG=".build/Ration-${VERSION}.dmg"
          SHA="$(shasum -a 256 "$DMG" | cut -d' ' -f1)"

          # Idempotent: create the release, or attach the build to the
          # existing one if this tag has been released before.
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "$DMG" --clobber
          else
            gh release create "${RELEASE_TAG}" "$DMG" \
              --title "Ration ${VERSION}" --generate-notes
          fi

          echo "### Cask update" >> "$GITHUB_STEP_SUMMARY"
          echo '```ruby' >> "$GITHUB_STEP_SUMMARY"
          echo "version \"${VERSION}\"" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256 \"${SHA}\"" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  release-linux:
    name: Build and publish (Linux ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          # See ci.yml — ARM runner Swift install is broken upstream.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve the release tag
        run: echo "RELEASE_TAG=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Test
        run: swift test

      - name: Build Linux tarball
        run: ./Scripts/bundle-linux.sh

      - name: Publish Linux artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          ARCH="$(uname -m)"
          TARBALL=".build/ration-${VERSION}-linux-${ARCH}.tar.gz"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "$TARBALL" --clobber
          else
            gh release create "${RELEASE_TAG}" "$TARBALL" \
              --title "Ration ${VERSION}" --generate-notes
          fi
