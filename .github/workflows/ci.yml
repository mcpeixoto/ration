name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Don't pin an exact Xcode path — runner images rename it every release.
      # Take the newest installed, and fail loudly if it is too old for the
      # Swift 6 language mode this package uses.
      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          swift --version

      - name: Build
        run: swift build --build-tests

      # RationKit tests touch neither the network nor the keychain, so they run
      # unmodified on a clean runner.
      - name: Test
        run: swift test

      - name: Assemble the app bundle
        run: ./Scripts/bundle.sh release

      - name: Verify the bundle launches as a menu bar app
        run: |
          plist=.build/Ration.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$plist")" = "true"
          test -x .build/Ration.app/Contents/MacOS/Ration

      # The security posture in SECURITY.md is only true if it holds for the
      # binary we actually ship, not just the source.
      #
      # Two categories, and the difference matters:
      #   - api.anthropic.com is one host Ration *sends a request to*, and
      #     the one that sees the Claude Code token.
      #   - api2.cursor.sh is the other, and sees the Cursor session token.
      #   - github.com / raw.githubusercontent.com carry signed update checks,
      #     with no credential and no usage data.
      #   - buymeacoffee.com is a link the user can click. Ration never
      #     requests it; the string is in the binary because the button has to
      #     know where to send the browser.
      #
      # Codex is read from disk and added nothing to this list. Cursor did:
      # its plan percentage is not on disk, so the host is a real change and
      # has to appear here.
      - name: Check the shipped binary reaches only its known hosts
        run: |
          hosts=$(strings .build/Ration.app/Contents/MacOS/Ration \
            | grep -oE 'https?://[A-Za-z0-9.-]+' \
            | sed -E 's#https?://##' | sort -u \
            | grep -vE '^(api\.anthropic\.com|api2\.cursor\.sh|github\.com|raw\.githubusercontent\.com|buymeacoffee\.com|x\.com)$' || true)
          if [ -n "$hosts" ]; then
            echo "::error::unexpected host(s) in the shipped binary:"
            echo "$hosts"
            exit 1
          fi
          echo "OK: no unexpected hosts"

      # The binary must not carry the *name* of another tool's credential store,
      # let alone read it. Mirrors credentialsOfOtherToolsAreNeverTouched.
      - name: Check the shipped binary names no other tool's credentials
        run: |
          found=$(strings .build/Ration.app/Contents/MacOS/Ration \
            | grep -oE 'auth\.json|access_token|id_token|refresh_token|oauth_creds|WorkosCursorSessionToken' \
            | sort -u || true)
          if [ -n "$found" ]; then
            echo "::error::the binary references another tool's credentials:"
            echo "$found"
            exit 1
          fi
          echo "OK: no foreign credential references"

  linux:
    name: Test (Linux ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          # ubuntu-24.04-arm + setup-swift@v2 currently installs a broken Swift
          # toolchain (ELF parse error). aarch64 builds work from source locally.
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Install the C libraries
        run: |
          sudo apt-get update
          # The tray links against GTK 3, Cairo, GDBus, libdbusmenu and
          # libayatana-appindicator3.
          # Without them the CLI still builds, but `swift build` builds every
          # product and the tray fails at link time.
          sudo apt-get install -y libsqlite3-dev libgtk-3-dev \
            libayatana-appindicator3-dev libdbusmenu-gtk3-dev

      - name: Build
        run: swift build --build-tests -c debug

      - name: Test
        run: swift test

      - name: Build release CLI
        run: swift build -c release --product ration

      - name: Build the tray, and check it runs without a display
        run: |
          swift build -c release --product ration-tray
          .build/release/ration-tray --version
          # Drawing the icon needs Cairo but no X server, so it is the cheapest
          # end-to-end check that the C interop is wired up correctly.
          .build/release/ration-tray --write-icon .build/ration.png --icon-size 128
          test -s .build/ration.png

      # A tray with no display must say so and exit. Checked for exactly the
      # exit code it promises: a bare "did not succeed" would also be satisfied
      # by the process hanging until `timeout` killed it, which is the failure
      # this is meant to catch.
      - name: Check the tray refuses to start without a display
        run: |
          set +e
          DISPLAY= timeout 20 .build/release/ration-tray
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::expected exit 1 with no display, got $code"
            exit 1
          fi

      - name: Verify the CLI runs
        run: .build/release/ration version

      - name: Verify history commands are available
        run: .build/release/ration help | grep -q activity

  format:
    name: Format
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: swift format lint --recursive --strict Sources Tests
