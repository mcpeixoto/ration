name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Don't pin an exact Xcode path — runner images rename it every release.
      # Take the newest installed, and fail loudly if it is too old for the
      # Swift 6 language mode this package uses.
      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          swift --version

      - name: Build
        run: swift build --build-tests

      # RationKit tests touch neither the network nor the keychain, so they run
      # unmodified on a clean runner.
      - name: Test
        run: swift test

      - name: Assemble the app bundle
        run: ./Scripts/bundle.sh release

      - name: Verify the bundle launches as a menu bar app
        run: |
          plist=.build/Ration.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$plist")" = "true"
          test -x .build/Ration.app/Contents/MacOS/Ration

      # The security posture in SECURITY.md is only true if it holds for the
      # binary we actually ship, not just the source.
      # Anthropic for usage; GitHub for signed updates. Nothing else.
      - name: Check the shipped binary reaches only its two known hosts
        run: |
          hosts=$(strings .build/Ration.app/Contents/MacOS/Ration \
            | grep -oE 'https?://[A-Za-z0-9.-]+' \
            | sed -E 's#https?://##' | sort -u \
            | grep -vE '^(api\.anthropic\.com|github\.com|raw\.githubusercontent\.com)$' || true)
          if [ -n "$hosts" ]; then
            echo "::error::unexpected host(s) in the shipped binary:"
            echo "$hosts"
            exit 1
          fi
          echo "OK: no unexpected hosts"

  format:
    name: Format
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: swift format lint --recursive --strict Sources Tests
