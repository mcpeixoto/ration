name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Don't pin an exact Xcode path — runner images rename it every release.
      # Take the newest installed, and fail loudly if it is too old for the
      # Swift 6 language mode this package uses.
      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          swift --version

      - name: Build
        run: swift build --build-tests

      # RationKit tests touch neither the network nor the keychain, so they run
      # unmodified on a clean runner.
      - name: Test
        run: swift test

      - name: Assemble the app bundle
        run: ./Scripts/bundle.sh release

      - name: Verify the bundle launches as a menu bar app
        run: |
          plist=.build/Ration.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$plist")" = "true"
          test -x .build/Ration.app/Contents/MacOS/Ration

      # The security posture in SECURITY.md is only true if it holds for the
      # binary we actually ship, not just the source.
      #
      # Two categories, and the difference matters:
      #   - api.anthropic.com is the one host Ration *sends a request to*, and
      #     the only one that ever sees a credential.
      #   - github.com / raw.githubusercontent.com carry signed update checks,
      #     with no credential and no usage data.
      #   - buymeacoffee.com is a link the user can click. Ration never
      #     requests it; the string is in the binary because the button has to
      #     know where to send the browser.
      #
      # Supporting a second provider added nothing to this list: Codex is read
      # from disk. If a host ever appears here, that is a real change to what
      # the app does and it should have to be argued for in a diff.
      - name: Check the shipped binary reaches only its known hosts
        run: |
          hosts=$(strings .build/Ration.app/Contents/MacOS/Ration \
            | grep -oE 'https?://[A-Za-z0-9.-]+' \
            | sed -E 's#https?://##' | sort -u \
            | grep -vE '^(api\.anthropic\.com|github\.com|raw\.githubusercontent\.com|buymeacoffee\.com)$' || true)
          if [ -n "$hosts" ]; then
            echo "::error::unexpected host(s) in the shipped binary:"
            echo "$hosts"
            exit 1
          fi
          echo "OK: no unexpected hosts"

      # The binary must not carry the *name* of another tool's credential store,
      # let alone read it. Mirrors credentialsOfOtherToolsAreNeverTouched.
      - name: Check the shipped binary names no other tool's credentials
        run: |
          found=$(strings .build/Ration.app/Contents/MacOS/Ration \
            | grep -oE 'auth\.json|access_token|id_token|refresh_token|oauth_creds|WorkosCursorSessionToken' \
            | sort -u || true)
          if [ -n "$found" ]; then
            echo "::error::the binary references another tool's credentials:"
            echo "$found"
            exit 1
          fi
          echo "OK: no foreign credential references"

  format:
    name: Format
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: swift format lint --recursive --strict Sources Tests
